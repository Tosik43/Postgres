<tr>

    <th style="width: 30%;">

        <a
            class="text-decoration-none text-dark ajax-health-disorder-sort"
            href="?q={{ query|urlencode }}&sort=name&direction={% if sort == 'name' and direction == 'asc' %}desc{% else %}asc{% endif %}"
        >

            Нарушение

            {% if sort == "name" %}

                {% if direction == "asc" %}
                    ▲
                {% else %}
                    ▼
                {% endif %}

            {% else %}

                ↕

            {% endif %}

        </a>

    </th>


    <th style="width: 50%;">

        <a
            class="text-decoration-none text-dark ajax-health-disorder-sort"
            href="?q={{ query|urlencode }}&sort=health_features&direction={% if sort == 'health_features' and direction == 'asc' %}desc{% else %}asc{% endif %}"
        >

            Особенности здоровья

            {% if sort == "health_features" %}

                {% if direction == "asc" %}
                    ▲
                {% else %}
                    ▼
                {% endif %}

            {% else %}

                ↕

            {% endif %}

        </a>

    </th>


    <th style="width: 20%; min-width: 150px;">
        Действия
    </th>

</tr>
