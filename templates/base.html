<!doctype html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}База данных студентов{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">

</head>

<body>

<nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold" href="{% url 'student_list' %}">
            База данных студентов
        </a>
        
        <div class="d-flex gap-3">
            <a class="nav-link text-white {% if request.resolver_match.url_name in 'student_list student_detail student_create student_edit student_delete student_archive student_restore student_delete_forever' %}fw-bold{% endif %}" 
               href="{% url 'student_list' %}">
                Студенты
            </a>

            <a class="nav-link text-white {% if request.resolver_match.url_name in 'reference_list faculty_list faculty_create faculty_edit faculty_delete faculty_archive faculty_restore faculty_delete_forever educational_program_list educational_program_create educational_program_edit educational_program_delete educational_program_archive educational_program_restore educational_program_delete_forever' %}fw-bold{% endif %}"
               href="{% url 'reference_list' %}">
                Справочники
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="toast-container position-fixed top-0 end-0 p-3">

    {% if messages %}

        {% for message in messages %}

            <div class="toast text-bg-success border-0"
                 role="alert"
                 data-bs-delay="3000">

                <div class="d-flex">

                    <div class="toast-body">

                        {{ message }}

                    </div>

                    <button
                        type="button"
                        class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast">
                    </button>

                </div>

            </div>

        {% endfor %}

    {% endif %}

</div>

    {% block content %}
    {% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/base.js' %}"></script>

<script src="{% static 'js/toast.js' %}"></script>

</body>
</html>
