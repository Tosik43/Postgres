{% extends "base.html" %}

{% block content %}

<h1>Студенты</h1>

<table border="1">

<tr>

    <th>ФИО</th>
    <th>СНИЛС</th>
    <th>Статус</th>

</tr>

{% for student in students %}

<tr>

    <td>{{ student.full_name }}</td>
    <td>{{ student.snils }}</td>
    <td>{{ student.get_study_status_display }}</td>

</tr>

{% endfor %}

</table>

{% endblock %}
