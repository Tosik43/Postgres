{% extends "base.html" %}

{% block title %}
Факультеты
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2 class="mb-0">
        Факультеты
    </h2>

    <a
        href="#"
        class="btn btn-success">

        + Добавить факультет

    </a>

</div>


<table class="table table-bordered table-hover align-middle">

    <thead class="table-primary">

        <tr>

            <th>
                Название
            </th>

            <th width="180">
                Действия
            </th>

        </tr>

    </thead>

    <tbody>

    {% for faculty in faculties %}

        <tr>

            <td>
                {{ faculty.name }}
            </td>

            <td>

                <a
                    href="#"
                    class="btn btn-warning btn-sm">

                    Изменить

                </a>

            </td>

        </tr>

    {% empty %}

        <tr>

            <td
                colspan="2"
                class="text-center">

                Факультетов пока нет

            </td>

        </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
