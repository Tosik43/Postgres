services:

  web:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - .:/workspace

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db

    command: python manage.py runserver 0.0.0.0:8000


  db:
    image: postgres:16

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

volumes:
  postgres_data: