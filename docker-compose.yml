services:

  web:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - .:/workspace

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db

    command: python manage.py runserver 0.0.0.0:8000


  db:
    image: postgres:16

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

  
  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: 5432
      TZ: Europe/Moscow

    volumes:
      - ./media:/workspace/media:ro
      - ./backup-data:/backups

    depends_on:
      - db


volumes:
  postgres_data: